<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Portrait placeholder for Pernilla Isa Hansen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2638"/>
      <stop offset="100%" stop-color="#0E1A2B"/>
    </linearGradient>
    <pattern id="grain" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="transparent"/>
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter>
      <rect width="200" height="200" filter="url(#n)" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#grain)" style="mix-blend-mode:multiply"/>

  <!-- Editorial frame -->
  <rect x="40" y="40" width="520" height="720" fill="none" stroke="#B7892F" stroke-width="0.5" opacity="0.4"/>

  <!-- Monogram -->
  <g transform="translate(300 380)" text-anchor="middle" fill="#F7F4ED" font-family="Georgia, 'GT Sectra', serif">
    <text font-size="220" font-weight="500" letter-spacing="8" y="0">PI</text>
  </g>

  <!-- Caption -->
  <g fill="#F7F4ED" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="2.5">
    <text x="60" y="80" opacity="0.7">PORTRÆT · PLACEHOLDER</text>
    <text x="60" y="740" opacity="0.7">PERNILLA ISA HANSEN</text>
    <text x="540" y="740" text-anchor="end" opacity="0.7" fill="#B7892F">PI · 01</text>
  </g>

  <!-- Hairline -->
  <line x1="60" y1="700" x2="540" y2="700" stroke="#F7F4ED" stroke-width="0.5" opacity="0.3"/>
</svg>
